spring.application.name=bloodinventory
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blood_inventory_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

nvidia.nim.api-key=${NVIDIA_NIM_API_KEY:}
nvidia.nim.base-url=${NVIDIA_NIM_BASE_URL:https://integrate.api.nvidia.com}
nvidia.nim.chat-model=${NVIDIA_NIM_CHAT_MODEL:meta/llama-3.3-70b-instruct}
nvidia.nim.embedding-model=${NVIDIA_NIM_EMBEDDING_MODEL:nvidia/nv-embedqa-e5-v5}
nvidia.nim.rerank-url=${NVIDIA_NIM_RERANK_URL:https://ai.api.nvidia.com/v1/retrieval/nvidia/reranking}
nvidia.nim.rerank-model=${NVIDIA_NIM_RERANK_MODEL:nvidia/nv-rerankqa-mistral-4b-v3}
nvidia.nim.vision-url=${NVIDIA_NIM_VISION_URL:https://ai.api.nvidia.com/v1/gr/meta/llama-3.2-90b-vision-instruct/meta/llama-3.2-90b-vision-instruct}
nvidia.nim.vision-model=${NVIDIA_NIM_VISION_MODEL:meta/llama-3.2-90b-vision-instruct}
nvidia.nim.temperature=${NVIDIA_NIM_TEMPERATURE:0.2}
nvidia.nim.max-tokens=${NVIDIA_NIM_MAX_TOKENS:700}


spring.thymeleaf.cache=false

server.port=${PORT:8082}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.max-http-request-header-size=16KB
server.tomcat.max-parameter-count=200
server.tomcat.max-http-form-post-size=1MB
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.window-minutes=${LOGIN_ATTEMPT_WINDOW_MINUTES:15}
app.security.login.block-minutes=${LOGIN_BLOCK_MINUTES:15}

# --- STATIC RESOURCE CACHE BUSTING ---
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
