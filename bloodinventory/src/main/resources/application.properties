spring.application.name=bloodinventory
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/blood_inventory_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

nvidia.nim.api-key=${NVIDIA_NIM_API_KEY:}
nvidia.nim.base-url=${NVIDIA_NIM_BASE_URL:https://integrate.api.nvidia.com}
nvidia.nim.chat-model=${NVIDIA_NIM_CHAT_MODEL:meta/llama-3.3-70b-instruct}
nvidia.nim.embedding-model=${NVIDIA_NIM_EMBEDDING_MODEL:nvidia/nv-embedqa-e5-v5}
nvidia.nim.rerank-url=${NVIDIA_NIM_RERANK_URL:https://ai.api.nvidia.com/v1/retrieval/nvidia/reranking}
nvidia.nim.rerank-model=${NVIDIA_NIM_RERANK_MODEL:nvidia/nv-rerankqa-mistral-4b-v3}
nvidia.nim.vision-url=${NVIDIA_NIM_VISION_URL:https://ai.api.nvidia.com/v1/gr/meta/llama-3.2-90b-vision-instruct/meta/llama-3.2-90b-vision-instruct}
nvidia.nim.vision-model=${NVIDIA_NIM_VISION_MODEL:meta/llama-3.2-90b-vision-instruct}
nvidia.nim.temperature=${NVIDIA_NIM_TEMPERATURE:0.2}
nvidia.nim.max-tokens=${NVIDIA_NIM_MAX_TOKENS:700}


spring.thymeleaf.cache=false

server.port=8082
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

app.password-reset.code-minutes=${PASSWORD_RESET_CODE_MINUTES:10}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
management.health.mail.enabled=false

# --- STATIC RESOURCE CACHE BUSTING ---
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
