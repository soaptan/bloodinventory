<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error - Blood Inventory Management System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
<main class="panel">
    <div class="eyebrow">System Error</div>
    <h1>Something went wrong</h1>
    <p th:text="${errorMessage ?: 'An unexpected error occurred. Please contact the IT Administrator.'}">
        An unexpected error occurred. Please contact the IT Administrator.
    </p>
    <div class="actions">
        <a class="primary" th:href="@{/dashboard}">Return to Dashboard</a>
        <button type="button" onclick="history.back()">Go Back</button>
    </div>
</main>
</body>
</html>
