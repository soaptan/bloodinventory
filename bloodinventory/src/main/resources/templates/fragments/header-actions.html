<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Actions Fragment</title>
</head>
<body>

<div th:fragment="adminProfileMenu" class="app-actions">
    <button type="button"
            class="theme-toggle"
            data-theme-toggle
            aria-pressed="false"
            aria-label="Switch to dark mode"
            title="Switch to dark mode">
        <span class="theme-toggle-icon theme-toggle-moon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
            </svg>
        </span>
        <span class="theme-toggle-icon theme-toggle-sun" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="m4.93 4.93 1.41 1.41"></path>
                <path d="m17.66 17.66 1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="m6.34 17.66-1.41 1.41"></path>
                <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
        </span>
        <span class="sr-only" data-theme-toggle-label>Switch to dark mode</span>
    </button>

    <div class="notification-menu" data-notification-menu>
        <button type="button"
                class="notification-trigger header-icon-button"
                data-notification-toggle
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-label="Open notifications"
                title="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notification-badge"
                  th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}"
                  th:text="${unreadNotificationCount > 99 ? '99+' : unreadNotificationCount}">1</span>
        </button>

        <div class="notification-dropdown" data-notification-panel role="dialog" aria-label="Notifications">
            <div class="notification-header">
                <div>
                    <strong>Notifications</strong>
                    <span>Insert, update, delete, login, and logout activity</span>
                </div>
                <div class="notification-header-actions">
                    <form th:if="${unreadNotificationCount != null and unreadNotificationCount > 0}"
                          th:action="@{/notifications/read-all}"
                          method="post"
                          class="notification-read-form">
                        <button type="submit" class="notification-read-all">Read all</button>
                    </form>
                    <span class="notification-total"
                          th:text="${unreadNotificationCount != null ? unreadNotificationCount : 0}">0</span>
                </div>
            </div>

            <div class="notification-empty"
                 th:if="${recentNotifications == null or #lists.isEmpty(recentNotifications)}">
                No activity recorded yet.
            </div>

            <div class="notification-list" th:if="${recentNotifications != null and !#lists.isEmpty(recentNotifications)}">
                <div class="notification-item"
                     th:each="notification : ${recentNotifications}"
                     th:classappend="${notification.read == false} ? ' unread'">
                    <span class="notification-dot"
                          th:classappend="${#strings.toLowerCase(notification.actionType)}"></span>
                    <span class="notification-copy">
                        <strong th:text="${notification.moduleName}">Staff Management</strong>
                        <span th:text="${notification.message}">Created staff account.</span>
                        <small>
                            <span th:text="${notification.actionType}">INSERT</span>
                            <span th:if="${notification.actorFullName != null}"
                                  th:text="| by ${notification.actorFullName}|"> by Staff Name</span>
                            <span th:if="${notification.actorFullName == null and notification.actorUsername != null}"
                                  th:text="| by ${notification.actorUsername}|"> by admin</span>
                            <span th:if="${notification.actorFullName != null and notification.actorUsername != null}"
                                  th:text="| (${notification.actorUsername})|"> (admin)</span>
                            <span th:if="${notification.createdAt != null}"
                                  th:text="| · ${#dates.format(notification.createdAt, 'MMM dd, HH:mm')}|"> · Apr 26, 15:40</span>
                        </small>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <div class="profile-menu" data-profile-menu>
        <button type="button"
                class="profile-trigger"
                data-profile-toggle
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-label="Open profile menu">
            <span class="profile-trigger-avatar" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 20a8 8 0 0 1 16 0"></path>
                </svg>
            </span>
            <span class="profile-trigger-label">My Profile</span>
            <span class="profile-trigger-caret" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="m6 9 6 6 6-6"></path>
                </svg>
            </span>
        </button>

        <div class="profile-dropdown" data-profile-panel role="dialog" aria-label="Profile menu">
            <a th:href="@{/profile}" class="profile-dropdown-item">
                <span class="profile-dropdown-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 20a8 8 0 0 1 16 0"></path>
                    </svg>
                </span>
                <span>My Profile</span>
            </a>

            <form th:action="@{/logout}" method="post" class="profile-dropdown-form">
                <button type="submit" class="profile-dropdown-item profile-dropdown-button">
                    <span class="profile-dropdown-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <path d="m16 17 5-5-5-5"></path>
                            <path d="M21 12H9"></path>
                        </svg>
                    </span>
                    <span>Logout</span>
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
