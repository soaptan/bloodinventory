<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password - Blood Inventory Management System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/auth-pages.css}">
</head>
<body>
<div class="background-shape-left"></div>
<div class="background-shape-right"></div>

<main class="auth-card">
    <div class="brand-badge">Blood Bank Digital Platform</div>
    <div class="auth-header">
        <h1>Reset Password</h1>
        <p>Verify your staff details and choose a new password.</p>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" role="alert" th:text="${errorMessage}"></div>

    <form th:action="@{/forgot-password}" method="post" novalidate data-validate-form>
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="50" pattern="[A-Za-z0-9._-]+"
                   th:value="${username}" placeholder="e.g. aisyah.rahman">
            <p id="username-error" class="field-error" th:text="${fieldErrors != null ? fieldErrors.get('username') : ''}"></p>
        </div>
        <div class="form-group">
            <label for="email">Registered Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required maxlength="100"
                   th:value="${email}" placeholder="name@bloodbank.my">
            <p id="email-error" class="field-error" th:text="${fieldErrors != null ? fieldErrors.get('email') : ''}"></p>
        </div>
        <div class="form-group">
            <label for="icNumber">IC Number</label>
            <input id="icNumber" name="icNumber" type="text" autocomplete="off" required maxlength="14" pattern="[0-9]{6}-?[0-9]{2}-?[0-9]{4}"
                   th:value="${icNumber}" placeholder="850101-10-2001">
            <p id="icNumber-error" class="field-error" th:text="${fieldErrors != null ? fieldErrors.get('icNumber') : ''}"></p>
        </div>
        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password"
                   required minlength="8" maxlength="72"
                   pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9\s])\S{8,72}"
                   title="Use uppercase and lowercase letters, a number, and a special character, with no spaces.">
            <p id="newPassword-error" class="field-error" th:text="${fieldErrors != null ? fieldErrors.get('newPassword') : ''}"></p>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="72" data-match="newPassword">
            <p id="confirmPassword-error" class="field-error" th:text="${fieldErrors != null ? fieldErrors.get('confirmPassword') : ''}"></p>
        </div>
        <button type="submit" class="primary-btn">Reset Password</button>
    </form>

    <div class="auth-links">
        <a th:href="@{/login}">Back to login</a>
        <a th:href="@{/forgot-username}">Find username</a>
    </div>
    <p class="security-note">All staff details must match one active account.</p>
</main>
<script th:src="@{/js/auth-validation.js}"></script>
</body>
</html>
