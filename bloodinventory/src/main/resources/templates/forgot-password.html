<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password - Blood Inventory Management System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/auth-pages.css}">
</head>
<body>
<div class="background-shape-left"></div>
<div class="background-shape-right"></div>

<main class="auth-card">
    <div class="brand-badge">Blood Bank Digital Platform</div>
    <div class="auth-header">
        <h1>Reset Password</h1>
        <p>Confirm your staff details and set a new password. The database trigger will store it as a BCrypt hash.</p>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required
                   th:value="${username}" placeholder="e.g. aisyah.rahman">
        </div>
        <div class="form-group">
            <label for="email">Registered Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required
                   th:value="${email}" placeholder="name@bloodbank.my">
        </div>
        <div class="form-group">
            <label for="icNumber">IC Number</label>
            <input id="icNumber" name="icNumber" type="text" autocomplete="off" required
                   th:value="${icNumber}" placeholder="850101-10-2001">
        </div>
        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="8">
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8">
        </div>
        <button type="submit" class="primary-btn">Reset Password</button>
    </form>

    <div class="auth-links">
        <a th:href="@{/login}">Back to login</a>
        <a th:href="@{/forgot-username}">Find username</a>
    </div>
    <p class="security-note">Your old password cannot be shown because stored passwords are one-way hashes.</p>
</main>
</body>
</html>
