<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Access Denied - Blood Inventory Management System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #f8fafc;
            padding: 24px;
        }

        .panel {
            width: min(520px, 100%);
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 18px;
            background: #111827;
            padding: 32px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
        }

        .eyebrow {
            color: #fb7185;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 28px;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        a,
        button {
            border: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 10px;
            padding: 10px 14px;
            color: #f8fafc;
            background: #1f2937;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
        }

        .primary {
            background: #3b82f6;
            border-color: #3b82f6;
        }
    </style>
</head>
<body>
<main class="panel">
    <div class="eyebrow">Access Denied</div>
    <h1>This staff type cannot access this module.</h1>
    <p>
        Module access is controlled by the database staff-module security rules.
        Please return to your assigned dashboard or contact an administrator if this access should be changed.
    </p>
    <div class="actions">
        <a class="primary" th:href="@{/dashboard}">Return to Dashboard</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Sign Out</button>
        </form>
    </div>
</main>
</body>
</html>
