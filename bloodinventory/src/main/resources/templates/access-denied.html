<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Access Denied - Blood Inventory Management System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/access-denied.css}">
</head>
<body>
<main class="panel">
    <div class="eyebrow">Access Denied</div>
    <h1>This staff type cannot access this module.</h1>
    <p>
        Module access is controlled by the database staff-module security rules.
        Please return to your assigned dashboard or contact an administrator if this access should be changed.
    </p>
    <div class="actions">
        <a class="primary" th:href="@{/dashboard}">Return to Dashboard</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Sign Out</button>
        </form>
    </div>
</main>
</body>
</html>
